<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffc907">
    <title>Water Drop Game | charity: water</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="donation-nav" aria-label="Donation">
        <a href="https://www.charitywater.org/">Donate to charity: water</a>
    </nav>
    <div class="game-wrapper">
        <header class="game-header">
            <img class="brand-logo" src="img/cw_logo-horizontal.png" alt="charity: water">
            <h1 class="game-title">Water Drop</h1>
            <p class="game-tagline">Catch clean water. Keep pollution out.</p>
        </header>

        <section class="game-card" aria-label="Water Drop game">
            <div class="difficulty-control">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy — 10 points, slower drops</option>
                    <option value="normal" selected>Normal — 20 points</option>
                    <option value="hard">Hard — 30 points, faster drops</option>
                </select>
            </div>
            <div class="score-panel">
                <div class="stat">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score" aria-live="polite">0</span>
                </div>
                <div class="stat timer">
                    <span class="stat-label">Time left</span>
                    <span class="stat-value"><span id="time" aria-live="off">30</span><span class="seconds">s</span></span>
                </div>
                <div class="stat lives">
                    <span class="stat-label">Lives</span>
                    <span class="stat-value" id="lives" aria-label="3 lives">♥ ♥ ♥</span>
                </div>
            </div>

            <div class="game-instructions" id="instructions">
                <p>Click blue drops for <strong>1 point</strong>. Score <strong id="score-target">20 points</strong> to win the game. Avoid purple pollutants, and don't let clean water hit the ground!</p>
            </div>

            <div id="game-container" role="group" aria-label="Game area. Click blue water drops and avoid purple pollutant drops.">
                <p class="game-message" id="game-message" aria-live="polite">Press “Start Game” when you're ready!</p>
            </div>
            <div class="game-footer">
                <p class="game-result" id="game-result" aria-live="polite"></p>
                <div class="game-actions">
                    <button id="reset-btn" type="button" hidden>Reset Game</button>
                    <button id="start-btn" type="button">Start Game</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
